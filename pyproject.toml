[project]
name = "docgraph"
version = "0.1.0"
description = "Analiza documentación técnica con LangGraph y genera un one-pager con diagrama de arquitectura"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# El núcleo no depende de ningún SDK de proveedor: el grafo habla con el
# protocolo LLMProvider. Ver docs/adr/0004-abstraccion-de-proveedor.md
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
mcp = ["mcp>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
docgraph = "docgraph.__main__:main"
docgraph-mcp = "docgraph.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docgraph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
